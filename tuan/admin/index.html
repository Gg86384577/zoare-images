<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>+1 自動整單</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{--bg:#fff6f1;--paper:#fff;--ink:#3a2a2a;--mut:#8a7470;--line:#f1ddd5;--ac:#e2574c;--ac2:#f59e7a;--soft:#ffe9e1;--bt:#ffe8a8;--gr:#06c755;--ok:#2f8a57;--okbg:#e3f3e9;--warn:#b26a00;--warnbg:#fff1d6;

:root[data-theme="dark"]{--bg:#1f1817;--paper:#2b2221;--ink:#f6ebe7;--mut:#bba49e;--line:#463634;--ac:#ff8a7e;--ac2:#f7b195;--soft:#3e2a27;--bt:#4a3d1f;--okbg:#1f3a2a;--ok:#7fd3a0;--warnbg:#3d3020;--warn:#f0c071;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--b);padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.top{max-width:1220px;margin:0 auto 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.phone{border-radius:38px;background:#111;padding:10px;box-shadow:0 24px 60px -26px rgba(120,50,40,.55);position:sticky;top:12px}

.sb{display:flex;justify-content:space-between;padding:8px 22px 2px;font:600 13px/1 -apple-system,sans-serif;color:#111;background:#fff}

.t{font-size:10px;color:#eef3fb;white-space:nowrap;line-height:1.3}

.chip{display:inline-block;margin:4px 0 0 2px;font:700 11px/1.5 var(--b);padding:1px 8px;border-radius:99px;background:#fff3c4;color:#7a4b00;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip.ok{background:#e2574c;color:#fff}.chip.no{background:#666;color:#fff}.chip.q{background:#fff;color:#b26a00}
.me .chip{float:right}
.oa .av{background:#06c755;color:#fff;font:900 11px/1 var(--b)}
.card{background:#fff;border-radius:18px;overflow:hidden;width:240px;color:#111}

.qk{display:flex;flex-wrap:wrap;gap:6px}

.btn{border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:#fff;min-height:40px}
.btn.g{background:var(--soft);color:var(--ac)}.btn.l{background:var(--gr)}
.big{font-size:15.5px;padding:11px 18px}
/* ---------- admin ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:var(--soft);border-radius:16px;padding:12px}.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font:900 26px/1.2 var(--d);color:var(--ac)}
.set{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--bg);border:1px dashed var(--ac2);border-radius:16px;padding:12px;margin-bottom:14px}

.set input,.set select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--paper);color:var(--ink);width:120px}
.live{margin-left:auto;font-size:12.5px;color:var(--ok);background:var(--okbg);padding:4px 10px;border-radius:99px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--mut);border-radius:99px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}.tabs em{font-style:normal;background:var(--warn);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:780px}
.tbl th{font-size:12px;color:var(--mut);font-weight:500;text-align:left;padding:0 6px}
.tbl td{background:var(--bg);padding:8px 6px;vertical-align:middle}.tbl td:first-child{border-radius:14px 0 0 14px}.tbl td:last-child{border-radius:0 14px 14px 0}
.th{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:28px}
.tbl input{font:inherit;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:8px;padding:5px 6px;width:100%}
.tbl input:hover,.tbl input:focus{border-color:var(--line);background:var(--paper);outline:none}
.tbl td.nm input{min-width:170px}.tbl td.kw input{min-width:90px;font-size:12px;color:var(--mut)}.tbl input[type=date]{width:128px;font-size:13px}.tbl td{white-space:nowrap}.tbl td.nm,.tbl td.kw{white-space:normal}
.auto{font-size:10.5px;background:var(--okbg);color:var(--ok);border-radius:99px;padding:1px 7px;white-space:nowrap}
.pr{font-weight:700}.gm{font-size:12px;color:var(--ok)}.gm.low{color:var(--warn)}
.cnt{font-weight:900;color:var(--ac);font-size:16px}.flash{animation:fl 1s}@keyframes fl{0%{background:var(--bt)}100%{background:var(--bg)}}
.dl{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);white-space:nowrap}.dl.soon{background:var(--warnbg);color:var(--warn)}.dl.end{background:#8883;color:var(--mut)}
.empty{color:var(--mut);font-size:13.5px;text-align:center;padding:26px 10px;background:var(--bg);border-radius:16px}
.ord{display:grid;gap:10px}.oc{background:var(--bg);border-radius:16px;padding:12px 14px}
.oc h4{margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:4px 0;border-top:1px dashed var(--line)}
.ship{font-size:11.5px;background:var(--soft);color:var(--ac);border-radius:99px;padding:1px 8px;margin-left:6px}
.pend{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pend select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--paper);color:var(--ink)}
.note{white-space:pre-line;background:#06c75512;border:1px solid #06c75540;border-radius:14px;padding:10px 12px;font-size:13.5px}
.hint{color:var(--mut);font-size:12.5px;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1}
</style></head><body>
<div class="top"><span class="logo">+1 <em>自動整單</em></span><span class="tag">LINE 群組・連線代購・虛構示意</span>
<span class="who"><i>LINE</i>玲玲（用個人 LINE 登入後台）</span></div>
<div class="steps"><span><b>①</b> 群組貼照片＋一行字 → 自動上架</span><span><b>②</b> 客人打 +1／品名+1／回覆照片 +1 → 即時入單</span><span><b>③</b> 結單時間到 → 自動關單、算好每人金額、發通知</span></div>
<div class="wrap">
<div>
 <div class="phone"><div class="scr">
  <div class="sb"><span>20:00</span><span>▮▮▮ 📶 100%</span></div>
  <div class="lh"><span class="bk">‹</span><b>🇯🇵 玲玲東京連線團</b><small>(128)</small><span class="ic">🔍 ☰</span></div>
  <div class="chat" id="chat"><div class="day">今天</div></div>
  <form class="lin" id="f"><span class="pl">＋</span><input id="in" placeholder="以客人身分留言，例如 吉伊卡哇+1" autocomplete="off"><button>傳送</button></form>
 </div></div>
 <div class="ctrl">
  <button class="btn big" id="sim">▶ 播放一場直播（約 30 秒）</button>
  <p>或自己點，扮演客人留言：</p>
  <div class="qk"><button data-q="+1">+1</button><button data-q="吉伊卡哇 粉色+1">吉伊卡哇 粉色+1</button><button data-q="抹茶+2">抹茶+2</button><button data-q="+1" data-r="1">回覆第一張照片 +1</button><button data-q="取消抹茶">取消抹茶</button></div>
  <button class="btn g" id="close">⏰ 模擬「結單時間到」</button>
 </div>
</div>
<div class="panel">
  <div class="kpi"><div><span>下單人數</span><b id="k1">0</b></div><div><span>總件數</span><b id="k2">0</b></div><div><span>營業額</span><b id="k3">$0</b></div><div><span>預估毛利</span><b id="k4">$0</b></div></div>
  <div class="set">
    <label>今日匯率（日幣→台幣）<input id="fx" type="number" step="0.001" value="0.215"></label>
    <label>售價算法<select id="mode"><option value="x">成本 × 倍率</option><option value="p">成本 + 固定加價</option></select></label>
    <label id="lx">倍率<input id="mul" type="number" step="0.05" value="1.35"></label>
    <label id="lp" hidden>每件加價（台幣）<input id="add" type="number" step="10" value="120"></label>
    <span class="live">● 即時同步</span>
  </div>
  <div class="tabs"><button class="on" data-t="p">商品</button><button data-t="o">客人訂單</button><button data-t="w">待確認<em id="wc" hidden>0</em></button><button data-t="c">結單・出貨</button></div>
  <div id="v-p" class="scroll"></div>
  <div id="v-o" hidden></div>
  <div id="v-w" hidden></div>
  <div id="v-c" hidden></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const today=new Date();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}
// products are created from the seller's chat posts
const LIB={
 "吉伊卡哇":{e:"🐹",bg:"linear-gradient(135deg,#fff0f5,#ffd3e2)",kw:"吉伊卡哇,吉伊,chiikawa,小可愛"},
 "北海道牛奶夾心餅":{e:"🍪",bg:"linear-gradient(135deg,#fff1dc,#ffd3a8)",kw:"夾心餅,牛奶餅,餅乾"},
 "抹茶生巧克力":{e:"🍵",bg:"linear-gradient(135deg,#eef7e2,#c9e6b1)",kw:"抹茶,生巧"},
 "保濕面膜":{e:"🧖‍♀️",bg:"linear-gradient(135deg,#e6f3ff,#c4ddf7)",kw:"面膜"}};
let P=[],orders={},pending=[],last=null,closed=false,clock=20*60,photoQ=null;
const SHIP={"小美":"7-11","Joyce":"全家","阿凱媽咪":"郵局","Wendy":"面交","佩佩":"7-11","Tina":"全家","小葉":"7-11","你":"7-11"};
const FEE={"7-11":60,"全家":60,"郵局":80,"面交":0};
const AV={"你":"🙋","小美":"👩🏻","Joyce":"👱🏻‍♀️","阿凱媽咪":"👩🏽‍🍼","Wendy":"👩🏻‍🦰","佩佩":"🧕🏻","Tina":"👧🏻","小葉":"🧑🏻"};
const fx=()=>+$("#fx").value||0;
const cost=p=>Math.round(p.jpy*fx());
const price=p=>{if(p.over!=null)return p.over;const c=cost(p);return $("#mode").value==="x"?Math.ceil(c*(+$("#mul").value||1)/10)*10:c+(+$("#add").value||0)};
const byId=id=>P.find(p=>p.id===id);
function qty(id){let q=0;for(const o of Object.values(orders))for(const[k,v]of Object.entries(o))if(k.split("|")[0]==id)q+=v;return q}
function tm(){clock+=1+Math.floor(Math.random()*2);return String(Math.floor(clock/60)%24).padStart(2,"0")+":"+String(clock%60).padStart(2,"0")}
function add(html){const c=$("#chat");c.insertAdjacentHTML("beforeend",html);c.scrollTop=c.scrollHeight}
// --- seller posts photo, then a text line ---
function sellerPhoto(key){photoQ=key;const L=LIB[key];
 add('<div class="m" data-photo="'+key+'"><div class="av" style="background:#e2574c;color:#fff;font:900 13px/1 var(--b)">玲</div><div><div class="nm">玲玲🌷（連線主）</div><div class="rw"><div class="photo" style="background:'+L.bg+'">'+L.e+'<i>📷 現場拍</i></div><span class="t">'+tm()+'</span></div></div></div>')}
function parseListing(t){const m=t.match(/^(.+?)\s*[¥￥]\s*(\d+)(?:\s*限\s*(\d+))?(?:\s*([^\s\d]+\/[^\s\d]+))?(?:\s*(\d{1,2})\/(\d{1,2})\s*結單)?/);if(!m)return null;
 const y=today.getFullYear();return{name:m[1].trim(),jpy:+m[2],lim:m[3]?+m[3]:99,opt:m[4]?m[4].split("/"):null,dl:m[5]?y+"-"+String(m[5]).padStart(2,"0")+"-"+String(m[6]).padStart(2,"0"):""}}
function sellerText(t){const L=parseListing(t);let chip="";
 if(L&&photoQ){const base=Object.keys(LIB).find(k=>L.name.includes(k))||photoQ,lib=LIB[base];
  const p={id:"p"+(P.length+1),name:L.name,jpy:L.jpy,lim:L.lim,opt:L.opt,dl:L.dl,e:lib.e,bg:lib.bg,kw:lib.kw,photo:photoQ,over:null,isNew:1};P.push(p);last=p.id;photoQ=null;
  chip='<div><span class="chip">✓ 已自動上架：'+esc(p.name)+'</span></div>'}
 add('<div class="m"><div class="av" style="background:#e2574c;color:#fff;font:900 13px/1 var(--b)">玲</div><div><div class="nm">玲玲🌷（連線主）</div><div class="rw"><div class="bub">'+esc(t)+'</div><span class="t">'+tm()+'</span></div>'+chip+'</div></div>');render();if(chip)toast("後台已自動新增商品 👉")}
// --- customer +1 parsing ---
function findByText(s){s=s.toLowerCase();for(const p of P){const keys=[p.name,...p.kw.split(",")].map(x=>x.trim().toLowerCase()).filter(Boolean);if(keys.some(k=>s.includes(k)))return p}return null}
function parse(t,quoted){t=t.replace(/＋/g,"+").replace(/\s+/g," ").trim();
 let m=t.match(/^(取消|不要了?)\s*(.*)$/);if(m){const p=m[2]?findByText(m[2]):(quoted?byId(quoted):byId(last));return p?[{id:p.id,cancel:1}]:[{unk:t}]}
 const r=[],re=/([^+]*?)\+\s*(\d{1,2})/g;let seg;
 while((seg=re.exec(t))){let pre=seg[1].replace(/[，,、。!！~～]/g," ").trim();const q=+seg[2];
  const opt=(pre.match(/(粉色|白色|粉|白)/)||t.slice(re.lastIndex).match(/^\s*(粉色|白色|粉|白)/)||[])[1];const optN=opt?(opt.length===1?opt+"色":opt):"";
  const rest=pre.replace(/(粉色|白色|粉|白)/,"").replace(/我要|要|謝謝.*|玲玲/g,"").trim();
  let p=null;if(rest){p=findByText(rest);if(!p){r.push({unk:t});continue}}else p=quoted?byId(quoted):byId(last);
  if(p)r.push({id:p.id,q,opt:p.opt?(optN||""):""})}
 return r}
function say(who,text,quotedKey){const quoted=quotedKey?(P.find(p=>p.photo===quotedKey)||{}).id:null;const res=parse(text,quoted);let chips="";
 res.forEach(x=>{if(x.unk){pending.push({who,text});chips+='<span class="chip q">? 看不懂，放進「待確認」</span>';return}
  const p=byId(x.id);orders[who]=orders[who]||{};
