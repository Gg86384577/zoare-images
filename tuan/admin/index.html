<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="連線代購後台示意：客人在 LINE 群組喊 +1 即時入單；網站後台用 LINE 登入，自己改日幣價、匯率、毛利、數量、品名、結單日（虛構示意）。">
<meta property="og:title" content="+1 整單後台｜日幣×匯率自動算毛利"><meta property="og:image" content="https://gg86384577.github.io/zoare-images/tuan/admin/cover.png">
<title>+1 整單後台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{--bg:#fff6f1;--paper:#fff;--ink:#3a2a2a;--mut:#8a7470;--line:#f1ddd5;--ac:#e2574c;--ac2:#f59e7a;--soft:#ffe9e1;--bt:#ffe8a8;--chat:#a9c3dc;--gr:#06c755;--ok:#2f8a57;--okbg:#e3f3e9;--warn:#b26a00;--warnbg:#fff1d6;
--d:"Noto Serif TC",Georgia,serif;--b:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1817;--paper:#2b2221;--ink:#f6ebe7;--mut:#bba49e;--line:#463634;--ac:#ff8a7e;--ac2:#f7b195;--soft:#3e2a27;--bt:#4a3d1f;--chat:#33404d;--okbg:#1f3a2a;--ok:#7fd3a0;--warnbg:#3d3020;--warn:#f0c071;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1817;--paper:#2b2221;--ink:#f6ebe7;--mut:#bba49e;--line:#463634;--ac:#ff8a7e;--ac2:#f7b195;--soft:#3e2a27;--bt:#4a3d1f;--chat:#33404d;--okbg:#1f3a2a;--ok:#7fd3a0;--warnbg:#3d3020;--warn:#f0c071;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--b);padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.top{max-width:1180px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--d);font-weight:900;font-size:24px}.logo em{font-style:normal;color:var(--ac)}
.tag{background:var(--soft);color:var(--ac);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:99px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-size:13.5px}
.who i{width:26px;height:26px;border-radius:50%;background:var(--gr);color:#fff;font-style:normal;font-weight:900;display:grid;place-items:center;font-size:11px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
@media(max-width:940px){.wrap{grid-template-columns:1fr}}
/* phone */
.phone{background:var(--paper);border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px -24px rgba(160,70,50,.4);position:sticky;top:12px}
.ph-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.ph-h small{color:var(--mut);font-weight:400;margin-left:auto}
.chat{background:var(--chat);height:520px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
.m{display:flex;gap:6px;align-items:flex-end;max-width:94%}.m .av{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.m .nm{font-size:11px;color:#22303d;opacity:.75;margin:0 0 2px 2px}
.bub{background:#fff;color:#222;border-radius:15px;padding:6px 10px;font-size:13.5px}
.me{align-self:flex-end}.me .bub{background:#a6e38b}
.q{font-size:11.5px;color:#666;border-left:3px solid var(--ac2);padding-left:6px;margin-bottom:3px}
.hit{outline:2px solid var(--ac)}.ok{font-size:10.5px;background:var(--ac);color:#fff;border-radius:99px;padding:0 6px;margin-left:4px;white-space:nowrap}
.pp{background:#fff;border-radius:14px;overflow:hidden;width:200px;color:#222}
.pic{position:relative;display:grid;place-items:center;font-size:44px;height:110px}
.num{position:absolute;left:8px;top:2px;font:900 46px/1 var(--d);color:#111;-webkit-text-stroke:2px #fff;paint-order:stroke}
.pp div.c{padding:6px 10px 8px;font-size:12.5px}.pp b{display:block}
.bar{display:flex;gap:6px;padding:8px;background:var(--paper);border-top:1px solid var(--line)}
.bar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font:inherit;background:var(--bg);color:var(--ink)}
.btn{border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:#fff;min-height:38px}
.btn.g{background:var(--soft);color:var(--ac)}.btn.l{background:var(--gr)}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 8px;background:var(--paper)}
.quick button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;min-height:32px}
/* admin */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:var(--soft);border-radius:16px;padding:12px}.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font:900 24px/1.2 var(--d);color:var(--ac)}
.set{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--bg);border:1px dashed var(--ac2);border-radius:16px;padding:12px;margin-bottom:14px}
.set label{font-size:12px;color:var(--mut);display:grid;gap:3px}
.set input,.set select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--paper);color:var(--ink);width:120px}
.set .live{margin-left:auto;font-size:12.5px;color:var(--ok);background:var(--okbg);padding:4px 10px;border-radius:99px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--mut);border-radius:99px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl th{font-size:12px;color:var(--mut);font-weight:500;text-align:left;padding:0 6px}
.tbl td{background:var(--bg);padding:8px 6px;vertical-align:middle}.tbl td:first-child{border-radius:14px 0 0 14px}.tbl td:last-child{border-radius:0 14px 14px 0}
.th{width:56px;height:56px;border-radius:12px;position:relative;display:grid;place-items:center;font-size:26px}
.th span{position:absolute;left:4px;top:-2px;font:900 22px/1 var(--d);color:#111;-webkit-text-stroke:1.5px #fff;paint-order:stroke}
.tbl input{font:inherit;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:8px;padding:5px 6px;width:100%}
.tbl input:hover,.tbl input:focus{border-color:var(--line);background:var(--paper);outline:none}
.tbl .n{width:92px;white-space:nowrap}.tbl .s{width:56px}.tbl td.nm input{min-width:160px}.tbl input[type=date]{width:138px}.wrap>*{min-width:0}.tbl{min-width:820px}
.pr{font-weight:700}.gm{font-size:12px;color:var(--ok)}.gm.low{color:var(--warn)}
.cnt{font-weight:900;color:var(--ac)}.flash{animation:fl .9s}@keyframes fl{0%{background:var(--bt)}100%{background:var(--bg)}}
.dl{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);white-space:nowrap}.dl.soon{background:var(--warnbg);color:var(--warn)}
.scroll{overflow-x:auto}
.ord{display:grid;gap:10px}.oc{background:var(--bg);border-radius:16px;padding:12px}
.oc h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:14.5px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0;border-top:1px dashed var(--line)}
.ship{font-size:11.5px;background:var(--soft);color:var(--ac);border-radius:99px;padding:1px 8px;margin-left:6px}
.note{white-space:pre-line;background:#06c75512;border:1px solid #06c75540;border-radius:14px;padding:10px 12px;font-size:13.5px}
.hint{color:var(--mut);font-size:12.5px;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1}
</style></head><body>
<div class="top"><span class="logo">+1 <em>整單</em>後台</span><span class="tag">連線代購專用・虛構示意</span>
<span class="who"><i>LINE</i>玲玲（用個人 LINE 登入）</span></div>
<div class="wrap">
<div class="phone">
  <div class="ph-h">🇯🇵 東京連線團<small>LINE 群組・128 人</small></div>
  <div class="chat" id="chat"></div>
  <div class="quick"><button data-q="3+1">3+1</button><button data-q="5 粉色+2">5 粉色+2</button><button data-q="7+1">7+1</button><button data-q="取消 3">取消 3</button><button id="sim" style="background:var(--soft);color:var(--ac);border-color:transparent;font-weight:700">▶ 模擬喊單</button></div>
  <form class="bar" id="f"><input id="in" placeholder="以「你」留言，例如 3+1" autocomplete="off"><button class="btn">送出</button></form>
</div>
<div class="panel">
  <div class="kpi"><div><span>下單人數</span><b id="k1">0</b></div><div><span>總件數</span><b id="k2">0</b></div><div><span>營業額</span><b id="k3">$0</b></div><div><span>預估毛利</span><b id="k4">$0</b></div></div>
  <div class="set">
    <label>今日匯率（日幣→台幣）<input id="fx" type="number" step="0.001" value="0.215"></label>
    <label>售價算法<select id="mode"><option value="x">成本 × 倍率</option><option value="p">成本 + 固定加價</option></select></label>
    <label id="lx">倍率<input id="mul" type="number" step="0.05" value="1.35"></label>
    <label id="lp" hidden>每件加價（台幣）<input id="add" type="number" step="10" value="120"></label>
    <span class="live">● 即時同步：群組有人 +1，這裡馬上更新</span>
  </div>
  <div class="tabs"><button class="on" data-t="p">商品（點欄位直接改）</button><button data-t="o">客人訂單</button><button data-t="c">結單・出貨</button></div>
  <div id="v-p" class="scroll"></div>
  <div id="v-o" hidden></div>
  <div id="v-c" hidden></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const today=new Date();const ds=d=>{const x=new Date(today);x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
let P=[
 {n:3,name:"北海道牛奶夾心餅 12入",jpy:1080,lim:40,dl:ds(2),e:"🍪",bg:"linear-gradient(135deg,#ffe3c2,#ffc7a6)",over:null},
 {n:5,name:"兔兔絨毛吊飾",jpy:1650,lim:20,dl:ds(2),e:"🐰",bg:"linear-gradient(135deg,#ffe0ec,#ffc4d9)",opt:["粉色","白色"],over:null},
 {n:7,name:"保濕面膜 7片",jpy:990,lim:50,dl:ds(5),e:"🧖‍♀️",bg:"linear-gradient(135deg,#dff1ff,#c4ddf7)",over:null},
 {n:12,name:"抹茶生巧克力 20入",jpy:1944,lim:25,dl:ds(1),e:"🍵",bg:"linear-gradient(135deg,#e5f3d6,#c9e6b1)",over:null},
 {n:18,name:"眼藥水 清涼款",jpy:698,lim:60,dl:ds(5),e:"💧",bg:"linear-gradient(135deg,#e6f7ff,#bfe6ff)",over:null}];
const SHIP={"小美":"7-11","Joyce":"全家","阿凱媽咪":"郵局","Wendy":"面交","佩佩":"7-11","Tina":"全家","小葉":"7-11","你":"7-11"};
const FEE={"7-11":60,"全家":60,"郵局":80,"面交":0};
const AV={"你":"🙋","小美":"👩🏻","Joyce":"👱🏻‍♀️","阿凱媽咪":"👩🏽‍🍼","Wendy":"👩🏻‍🦰","佩佩":"🧕🏻","Tina":"👧🏻","小葉":"🧑🏻"};
let orders={},last=null,tab="p";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1700)}
const fx=()=>+$("#fx").value||0;
function cost(p){return Math.round(p.jpy*fx())}
function price(p){if(p.over!=null)return p.over;const c=cost(p);return $("#mode").value==="x"?Math.ceil(c*(+$("#mul").value||1)/10)*10:c+(+$("#add").value||0)}
const byN=n=>P.find(p=>p.n==n);
function qty(n){let q=0;for(const o of Object.values(orders))for(const[k,v]of Object.entries(o))if(k.split("|")[0]==n)q+=v;return q}
function post(p){const d=document.createElement("div");d.className="m";d.innerHTML='<div class="av" style="background:var(--ac);color:#fff;font-weight:900;font-size:12px">玲</div><div><div class="nm">連線主</div><div class="pp"><div class="pic" style="background:'+p.bg+'"><span class="num">'+p.n+'</span>'+p.e+'</div><div class="c"><b>'+esc(p.name)+'</b>$'+price(p)+(p.opt?'・'+p.opt.join('／'):'')+'</div></div></div>';$("#chat").appendChild(d);last=p.n}
function parse(t){t=t.replace(/＋/g,"+").replace(/\s+/g," ").trim();let m=t.match(/^(取消|不要了?)\s*(\d{1,3})/);if(m)return[{n:+m[2],cancel:1}];
 const r=[],re=/(\d{1,3})?\s*(?:號)?\s*(粉色|白色)?\s*\+\s*(\d{1,2})\s*(粉色|白色)?/g;while((m=re.exec(t))){const n=m[1]?+m[1]:last;if(byN(n))r.push({n,q:+m[3],opt:m[2]||m[4]||""})}return r}
function say(who,text,quote){const res=parse(text),d=document.createElement("div");d.className="m"+(who==="你"?" me":"");let tag="";
 res.forEach(x=>{orders[who]=orders[who]||{};if(x.cancel){for(const k in orders[who])if(k.split("|")[0]==x.n)delete orders[who][k];tag+='<span class="ok">已取消 '+x.n+'</span>'}
  else{const p=byN(x.n);if(qty(x.n)+x.q>p.lim){tag+='<span class="ok" style="background:#999">'+x.n+' 已額滿</span>';return}const k=x.n+"|"+x.opt;orders[who][k]=(orders[who][k]||0)+x.q;tag+='<span class="ok">✓ '+x.n+(x.opt||"")+'×'+x.q+'</span>';flash(x.n)}});
 if(orders[who]&&!Object.keys(orders[who]).length)delete orders[who];
 d.innerHTML=(who==="你"?'':'<div class="av">'+(AV[who]||"🙂")+'</div>')+'<div>'+(who==="你"?'':'<div class="nm">'+esc(who)+'</div>')+'<div class="bub'+(res.length?' hit':'')+'">'+(quote?'<div class="q">回覆 '+quote+' 號照片</div>':'')+esc(text)+tag+'</div></div>';
 $("#chat").appendChild(d);$("#chat").scrollTop=1e6;render()}
let fl=new Set();function flash(n){fl.add(n)}
function render(){let n=0,items=0,rev=0,gp=0;const people=[];
 for(const[who,o]of Object.entries(orders)){let sum=0,c=0;const lines=[];for(const[k,q]of Object.entries(o)){const[pn,opt]=k.split("|"),p=byN(pn);lines.push({p,opt,q});sum+=price(p)*q;c+=cost(p)*q;items+=q}n++;rev+=sum;gp+=sum-c;people.push({who,lines,sum,ship:SHIP[who]||"7-11"})}
 $("#k1").textContent=n;$("#k2").textContent=items;$("#k3").textContent="$"+rev.toLocaleString();$("#k4").textContent="$"+gp.toLocaleString();
 const ae=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#v-p")?[document.activeElement.dataset.i,document.activeElement.dataset.f]:null;
 $("#v-p").innerHTML='<table class="tbl"><thead><tr><th></th><th>號碼</th><th>品名</th><th>日幣</th><th>成本</th><th>售價</th><th>已喊／上限</th><th>結單日</th></tr></thead><tbody>'+P.map((p,i)=>{const pr=price(p),c=cost(p),g=pr-c,gr=pr?Math.round(g/pr*100):0,q=qty(p.n),soon=(new Date(p.dl)-today)/864e5<1.5;
  return '<tr><td><div class="th" style="background:'+p.bg+'"><span>'+p.n+'</span>'+p.e+'</div></td><td class="s"><input data-i="'+i+'" data-f="n" value="'+p.n+'" class="s"></td><td class="nm"><input data-i="'+i+'" data-f="name" value="'+esc(p.name)+'"></td><td class="n"><input data-i="'+i+'" data-f="jpy" type="number" value="'+p.jpy+'" style="width:70px;display:inline">¥</td><td class="n">$'+c+'</td><td class="n"><input data-i="'+i+'" data-f="over" type="number" class="pr" value="'+pr+'"><div class="gm'+(gr<15?' low':'')+'">毛利 $'+g+'（'+gr+'%）</div></td><td class="n'+(fl.has(p.n)?' flash':'')+'"><span class="cnt">'+q+'</span> / <input data-i="'+i+'" data-f="lim" type="number" value="'+p.lim+'" style="width:50px;display:inline"></td><td><input data-i="'+i+'" data-f="dl" type="date" value="'+p.dl+'"><span class="dl'+(soon?' soon':'')+'">'+(soon?'快結單':'接單中')+'</span></td></tr>'}).join("")+'</tbody></table><p class="hint">改日幣或匯率，成本、售價、毛利會自動重算；售價也可以手動改。品名、數量上限、結單日都能直接點來改，存檔後群組裡的商品資訊同步更新。</p>';
 fl.clear();
 if(ae){const el=document.querySelector('#v-p [data-i="'+ae[0]+'"][data-f="'+ae[1]+'"]');if(el){el.focus();const v=el.value;if(el.type!=="date"&&el.type!=="number"){el.value="";el.value=v}}}
 $("#v-o").innerHTML=people.length?'<div class="ord">'+people.map(u=>'<div class="oc"><h4><span>'+esc(u.who)+'<span class="ship">'+u.ship+'</span></span><span style="color:var(--ac)">$'+(u.sum+FEE[u.ship])+'</span></h4>'+u.lines.map(l=>'<div class="row"><span>'+l.p.n+'. '+esc(l.p.name)+(l.opt?'（'+l.opt+'）':'')+'</span><b>×'+l.q+'　$'+price(l.p)*l.q+'</b></div>').join("")+'<div class="row"><span>運費</span><span>$'+FEE[u.ship]+'</span></div></div>').join("")+'</div>':'<p class="hint">還沒有訂單，左邊群組按「模擬喊單」或自己打 3+1。</p>';
 const g={};people.forEach(u=>(g[u.ship]=g[u.ship]||[]).push(u));
 $("#v-c").innerHTML=people.length?'<div style="display:grid;gap:10px">'+Object.entries(g).map(([s,L])=>'<div class="oc"><h4><span>📦 '+s+'（'+L.length+' 位）</span><span>代收合計 $'+L.reduce((a,u)=>a+u.sum+FEE[u.ship],0).toLocaleString()+'</span></h4>'+L.map(u=>'<div class="row"><span>'+esc(u.who)+'　'+u.lines.map(l=>l.p.n+(l.opt||"")+'×'+l.q).join("、")+'</span><b>'+(s==="面交"?'面交收':'貨到付款')+' $'+(u.sum+FEE[u.ship])+'</b></div>').join("")+'</div>').join("")+
 '<div class="note"><b>客人收到的結單通知（示意）</b>\n🧾 東京連線團 結單囉！\n'+people[0].lines.map(l=>l.p.n+'. '+l.p.name+(l.opt?'（'+l.opt+'）':'')+' ×'+l.q+'　$'+price(l.p)*l.q).join("\n")+'\n運費 $'+FEE[people[0].ship]+'（'+people[0].ship+'）\n💰 貨到付款 $'+(people[0].sum+FEE[people[0].ship])+'\n👉 點這裡確認寄送門市</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn l" id="push">📣 傳結單通知給 '+people.length+' 位</button><button class="btn g" id="csv">⬇ 匯出出貨清單（Excel）</button></div></div>':'<p class="hint">有訂單後，這裡會依 7-11／全家／郵局／面交分好出貨清單和代收金額。</p>';
 const pb=$("#push");if(pb)pb.onclick=()=>toast("示意：已傳給 "+people.length+" 位客人");

$("#v-p").addEventListener("change",e=>{const el=e.target,i=el.dataset.i,f=el.dataset.f;if(i==null)return;const p=P[i],v=el.value;
 if(f==="over"){p.over=+v===price({...p,over:null})?null:+v}else if(f==="jpy"||f==="lim"||f==="n"){p[f]=+v}else p[f]=v;render();toast("已存檔，群組商品資訊同步更新")});
["fx","mul","add"].forEach(id=>$("#"+id).addEventListener("input",()=>{P.forEach(p=>p.over=null);render()}));
